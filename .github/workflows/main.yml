name: Build APK & Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android APK build
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Build Android 7+ Offline APK
        run: node scripts/build-android-apk.mjs

      - name: Upload Android APK Artifact (Download from GitHub Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: JCVcreatives-Photobooth-APK
          path: ./dist/JCVcreatives-Photobooth.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (Direct GitHub Download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.6.0"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" ./dist/JCVcreatives-Photobooth.apk --clobber
          else
            gh release create "$TAG_NAME" ./dist/JCVcreatives-Photobooth.apk \
              --title "JCVcreatives Photobooth Android APK ($TAG_NAME)" \
              --notes "Standalone offline Android APK (compatible with Android 7.0 Nougat through Android 14). Includes HD Offline QR photo encoding, USB/Bluetooth/Wi-Fi thermal printing, and custom frames." \
              --latest
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write APK Download Links to Summary
        run: |
          echo "### 📲 Android APK Download Links" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Releases (Direct .APK):** [Download JCVcreatives-Photobooth.apk](https://github.com/${{ github.repository }}/releases/latest/download/JCVcreatives-Photobooth.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Pages (Direct .APK):** [${{ steps.deployment.outputs.page_url }}JCVcreatives-Photobooth.apk](${{ steps.deployment.outputs.page_url }}JCVcreatives-Photobooth.apk)" >> $GITHUB_STEP_SUMMARY
